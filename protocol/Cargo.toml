[package]
name = "protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
bier_derive = { path = "../../rpc/bier_derive" }
bierpc = { path = "../../rpc/bierpc" }
# bier_derive's generated code refers to `tokio` directly.
tokio = { version = "1.52.3", features = ["io-util"] }
sha2 = "0.10.9"
hmac = "0.12.1"
getrandom = "0.4.3"
# Only the raw-bytes KDF (`hash_password_into`), so the PHC-string / rng
# features are off.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
# TLS identity derived from the shared key (see `tls`). rustls itself comes via
# bierpc's re-export, so the provider version cannot drift from the transport.
hkdf = "0.12.4"
ed25519-dalek = "2.2.0"
rcgen = "0.13.2"
x509-parser = "0.16.0"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["full"] }
tokio-rustls = "0.26.4"
